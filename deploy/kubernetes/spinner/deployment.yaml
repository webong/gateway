apiVersion: apps/v1
kind: Deployment
metadata:
  name: spinner
  labels:
    app.kubernetes.io/name: spinner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spinner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spinner
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: spinner
          # Replace with the published Go-only image for your cluster.
          image: gateway-spinner:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5001
              protocol: TCP
          env:
            - name: GATEWAY_RUNTIME
              value: http
            - name: PORT
              value: "5001"
            # Replace this with your external Planner's private Service URL.
            - name: GATEWAY_LARAVEL_BACKEND_URL
              value: http://planner:8080
            - name: GATEWAY_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: spinner-planner
                  key: internal-token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
