; PHP settings applied identically to every benchmarked runtime.
;
; The image's CLI php (which runs Workerman) ships with opcache.enable_cli=0,
; while FrankenPHP's embedded SAPI uses opcache.enable=1. Comparing the two as
; shipped would measure that difference rather than the hosts, so the harness
; mounts this file into both the CLI conf.d and FrankenPHP's conf.d.
; (`--hosts=workerman-shipped` runs Workerman without it, for reference.)
memory_limit = 128M
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.validate_timestamps = 1
opcache.jit = disable
zend.assertions = -1
