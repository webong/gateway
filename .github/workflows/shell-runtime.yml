name: Shell runtime

on:
  push:
    paths:
      - '.github/workflows/shell-runtime.yml'
      - 'pkg/shell/runtime/**'
      - 'mod/driver/**'
      - 'pkg/spinner/bridge/**'
      - 'pkg/spinner/extensions/automation/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - '.github/workflows/shell-runtime.yml'
      - 'pkg/shell/runtime/**'
      - 'mod/driver/**'
      - 'pkg/spinner/bridge/**'
      - 'pkg/spinner/extensions/automation/**'
      - 'go.mod'
      - 'go.sum'

jobs:
  powershell:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify PowerShell is installed
        shell: pwsh
        run: |
          $command = Get-Command pwsh -ErrorAction Stop
          Write-Host "PowerShell executable: $($command.Source)"
      - name: Test shell runtime with PowerShell
        run: go test -mod=mod -count=1 ./pkg/shell/runtime
      - name: Test Shell bridge behavior
        if: runner.os == 'Linux'
        run: go test -mod=mod -count=1 ./pkg/spinner/bridge -run 'TestRoutePlanAllowsOnlyGeneratedShellNotifications|TestEdgeQueuesPlannerSelectedShellCompletionNoticeWithoutHookOutput|TestEdgeMarksBufferedNonzeroShellExitAsFailedCompletion|TestEdgeStreamsPlannerSelectedShellHook'
