name: Shell runtime

on:
  push:
    paths:
      - '.github/workflows/shell-runtime.yml'
      - 'pkg/shell/runtime/**'
      - 'mod/driver/**'
      - 'pkg/spinner/bridge/**'
      - 'pkg/spinner/extensions/automation/**'
      - 'tools/spinner/**'
      - 'pkg/shell/go.mod'
      - 'pkg/shell/go.sum'
      - 'pkg/spinner/go.mod'
      - 'pkg/spinner/go.sum'
      - 'go.work'
      - 'go.work.sum'
  pull_request:
    paths:
      - '.github/workflows/shell-runtime.yml'
      - 'pkg/shell/runtime/**'
      - 'mod/driver/**'
      - 'pkg/spinner/bridge/**'
      - 'pkg/spinner/extensions/automation/**'
      - 'tools/spinner/**'
      - 'pkg/shell/go.mod'
      - 'pkg/shell/go.sum'
      - 'pkg/spinner/go.mod'
      - 'pkg/spinner/go.sum'
      - 'go.work'
      - 'go.work.sum'

jobs:
  powershell:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/spinner/go.mod
          cache: true
      - name: Verify PowerShell is installed
        shell: pwsh
        run: |
          $command = Get-Command pwsh -ErrorAction Stop
          Write-Host "PowerShell executable: $($command.Source)"
      - name: Test shell runtime with PowerShell
        run: GOWORK=off go -C pkg/shell test -mod=readonly -count=1 ./runtime
      - name: Test Shell bridge behavior
        if: runner.os == 'Linux'
        run: GOWORK=off go -C tools/spinner test -mod=readonly -count=1 ./bridge -run 'TestRoutePlanAllowsOnlyGeneratedShellNotifications|TestEdgeQueuesPlannerSelectedShellCompletionNoticeWithoutHookOutput|TestEdgeMarksBufferedNonzeroShellExitAsFailedCompletion|TestEdgeStreamsPlannerSelectedShellHook'
