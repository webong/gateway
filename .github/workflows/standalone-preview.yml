name: Standalone Gateway acceptance

# Deliberately manual: builds and tests local candidates, never publishes images,
# tags, Composer metadata or extension assets.
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Full immutable source commit to build and test
        required: true
        type: string

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  standalone:
    name: ${{ matrix.runtime }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        runtime: [roadrunner, frankenphp]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      GOWORK: off
      GOTELEMETRY: off
      COMPOSER_ROOT_VERSION: dev-main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision }}
      - name: Verify immutable source selection
        id: source
        env:
          EXPECTED_SOURCE: ${{ inputs.source_revision }}
        run: |
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          actual=$(git rev-parse HEAD)
          test "$actual" = "$EXPECTED_SOURCE"
          # Composer path fixtures require dev-main; attach that name locally
          # without changing the selected commit or any source bytes.
          git checkout -B main "$actual"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version-file: pkg/spinner/go.mod
          cache-dependency-path: '**/go.sum'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          extensions: bcmath, curl, intl, mbstring, pcntl, pdo_pgsql, pdo_sqlite, sockets, sqlite3, zip
      - uses: docker/setup-buildx-action@v3
      - name: Verify publication controls without Docker access
        run: bash scripts/test-publish-gateway-image
      - name: Core HTTP fallback regression suite
        run: go -C pkg/roadrunner/cmd/router test -mod=readonly -race ./...
      - name: Build the production Router locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Gateway.router.Dockerfile
          build-args: GATEWAY_ROUTER_RUNTIME=${{ matrix.runtime }}
          load: true
          tags: gateway-preview:${{ matrix.runtime }}
          labels: org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=preview-${{ matrix.runtime }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=preview-${{ matrix.runtime }}-${{ matrix.arch }}
      - name: Build Web after the host image exists
        env:
          CGO_ENABLED: '0'
        run: |
          php scripts/build-gateway-runtime-extension pkg/web "$RUNNER_TEMP/extensions/webong%2fweb" 0.2.0-rc.1 "${{ steps.source.outputs.sha }}"
          scripts/archive-gateway-extension "$RUNNER_TEMP/extensions/webong%2fweb" "$RUNNER_TEMP/web.tar.gz"
      - name: Fresh installation, HTTPS traffic, replacement and restore
        run: python3 tools/release-acceptance/standalone.py gateway-preview:${{ matrix.runtime }} --web-archive "$RUNNER_TEMP/web.tar.gz" --report "$RUNNER_TEMP/standalone-report.json"
      - name: Packaged HTTP and WebSocket routing
        run: bash scripts/test-router-managed-route gateway-preview:${{ matrix.runtime }}
      - name: Install locked extension build tooling
        run: scripts/composer-install --prefer-dist
      - name: Custom extension activation and integrity
        env:
          GATEWAY_ROUTER_SKIP_BUILD: 'true'
          GATEWAY_ROUTER_IMAGE: gateway-preview:${{ matrix.runtime }}
        run: bash scripts/test-router-companion-image
