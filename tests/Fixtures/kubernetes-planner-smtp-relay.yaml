apiVersion: apps/v1
kind: Deployment
metadata:
  name: smtp-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-planner-smtp-relay-smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-planner-smtp-relay-smoke
    spec:
      containers:
        - name: smtp-relay
          image: gateway-email-relay-smoke:local
          imagePullPolicy: Never
          args: ["-addr", "0.0.0.0:2527", "-output", "/tmp/accepted.jsonl"]
          ports:
            - name: smtp-relay
              containerPort: 2527
          readinessProbe:
            tcpSocket:
              port: smtp-relay
            periodSeconds: 2
            failureThreshold: 20
---
apiVersion: v1
kind: Service
metadata:
  name: smtp-relay
spec:
  selector:
    app.kubernetes.io/name: gateway-planner-smtp-relay-smoke
  ports:
    - port: 2527
      targetPort: smtp-relay
