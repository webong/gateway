apiVersion: v1
kind: ConfigMap
metadata:
  name: webstream-source
data:
  source.php: |
    <?php
    header('Content-Type: text/event-stream');
    echo "id: private-1\n";
    echo "data: private-source-reached\n\n";
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webstream-source
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-planner-webstream-source-smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-planner-webstream-source-smoke
    spec:
      containers:
        - name: webstream-source
          image: gateway-planner:local
          imagePullPolicy: IfNotPresent
          command: ["php", "-S", "0.0.0.0:8080", "/source/source.php"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 20
      volumes:
        - name: source
          configMap:
            name: webstream-source
---
apiVersion: v1
kind: Service
metadata:
  name: webstream-source
spec:
  selector:
    app.kubernetes.io/name: gateway-planner-webstream-source-smoke
  ports:
    - port: 8080
      targetPort: http
