apiVersion: apps/v1
kind: Deployment
metadata:
  name: provision-worker-live
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-provision-worker-live
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-provision-worker-live
    spec:
      serviceAccountName: provision-worker
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provision-worker
          image: gateway-provision-k8s-smoke:local
          imagePullPolicy: Never
          env:
            - name: GATEWAY_LARAVEL_BACKEND_URL
              value: http://planner:8080
            - name: GATEWAY_PROVISIONING_TARGET_ID
              valueFrom:
                secretKeyRef:
                  name: provision-worker-target
                  key: target-id
            - name: GATEWAY_PROVISIONING_TARGET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: provision-worker-target
                  key: worker-token
            - name: GATEWAY_NODE_ID
              value: provision-worker-live
            - name: GATEWAY_CENTRIFUGO_KUBERNETES_IMAGE
              value: centrifugo/centrifugo:v6
            - name: GATEWAY_PROVISIONING_KUBERNETES_IMAGE_PULL_POLICY
              value: Never
            - name: GATEWAY_PROVISIONING_START_TIMEOUT
              value: 45s
            - name: GATEWAY_PROVISIONING_POLL_INTERVAL
              value: 2s
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
