apiVersion: v1
kind: Pod
metadata:
  name: provision-worker-check
  labels:
    app.kubernetes.io/name: gateway-provision-worker-check
spec:
  restartPolicy: OnFailure
  serviceAccountName: provision-worker
  automountServiceAccountToken: true
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: provision-worker
      image: gateway-provision-k8s-smoke:local
      imagePullPolicy: Never
      args: ["--check"]
      env:
        - name: GATEWAY_PLANNER_URL
          value: http://planner:8080
        - name: GATEWAY_PROVISIONING_TARGET_ID
          valueFrom:
            secretKeyRef:
              name: provision-worker-target
              key: target-id
        - name: GATEWAY_PROVISIONING_TARGET_TOKEN
          valueFrom:
            secretKeyRef:
              name: provision-worker-target
              key: worker-token
        - name: GATEWAY_NODE_ID
          value: provision-worker-check
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: tmp
          mountPath: /tmp
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: "1"
          memory: 256Mi
  volumes:
    - name: tmp
      emptyDir: {}
