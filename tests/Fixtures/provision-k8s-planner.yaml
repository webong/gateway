apiVersion: apps/v1
kind: Deployment
metadata:
  name: planner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-planner-smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-planner-smoke
    spec:
      containers:
        - name: planner
          image: gateway-k8s-planner-smoke:local
          imagePullPolicy: Never
          command: ["/bin/sh", "-c"]
          args:
            - >-
              touch /tmp/registry.sqlite &&
              php artisan migrate --force &&
              exec php -S 0.0.0.0:8080 -t public public/index.php
          envFrom:
            - secretRef:
                name: planner-credentials
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /http-smoke/worker
              port: http
            periodSeconds: 2
            failureThreshold: 20
---
apiVersion: v1
kind: Service
metadata:
  name: planner
spec:
  selector:
    app.kubernetes.io/name: gateway-planner-smoke
  ports:
    - port: 8080
      targetPort: http
