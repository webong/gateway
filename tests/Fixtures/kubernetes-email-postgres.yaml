apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-email-postgres-smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-email-postgres-smoke
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: Never
          envFrom:
            - secretRef:
                name: postgres-credentials
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "gateway"]
            periodSeconds: 2
            failureThreshold: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app.kubernetes.io/name: gateway-email-postgres-smoke
  ports:
    - port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-planner-smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-planner-smoke
    spec:
      containers:
        - name: planner
          image: gateway-k8s-planner-smoke:local
          imagePullPolicy: Never
          command: ["/bin/sh", "-c"]
          args:
            - >-
              php artisan migrate --realpath --path=/app/src/planner/database/migrations --force &&
              exec php -S 0.0.0.0:8080 -t public public/index.php
          envFrom:
            - secretRef:
                name: planner-credentials
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /http-smoke/worker
              port: http
            periodSeconds: 2
            failureThreshold: 20
---
apiVersion: v1
kind: Service
metadata:
  name: planner
spec:
  selector:
    app.kubernetes.io/name: gateway-planner-smoke
  ports:
    - port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smtp-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-smtp-relay-smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-smtp-relay-smoke
    spec:
      containers:
        - name: smtp-relay
          image: gateway-email-relay-smoke:local
          imagePullPolicy: Never
          args: ["-addr", "0.0.0.0:2527", "-output", "/tmp/accepted.jsonl"]
          ports:
            - name: smtp-relay
              containerPort: 2527
          readinessProbe:
            tcpSocket:
              port: smtp-relay
            periodSeconds: 2
            failureThreshold: 20
---
apiVersion: v1
kind: Service
metadata:
  name: smtp-relay
spec:
  selector:
    app.kubernetes.io/name: gateway-smtp-relay-smoke
  ports:
    - port: 2527
      targetPort: smtp-relay
