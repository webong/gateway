apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-router-smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-router-smoke
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: router
          image: gateway-k8s-router-smoke:local
          imagePullPolicy: Never
          env:
            - name: GATEWAY_RUNTIME
              value: http
            - name: PORT
              value: "5001"
            - name: GATEWAY_LARAVEL_BACKEND_URL
              value: http://planner:8080
            - name: GATEWAY_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: planner-credentials
                  key: GATEWAY_INTERNAL_TOKEN
            - name: GATEWAY_PROVISIONING_ROUTE_PROXY_ENABLED
              value: "true"
            - name: GATEWAY_PROVISIONING_ROUTE_CIDRS
              value: "127.0.0.1/32"
            - name: MAX_WORKERS
              value: "4"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 5001
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: router
spec:
  selector:
    app.kubernetes.io/name: gateway-router-smoke
  ports:
    - port: 8080
      targetPort: http
