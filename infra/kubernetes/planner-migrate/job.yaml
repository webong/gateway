apiVersion: batch/v1
kind: Job
metadata:
  name: planner-migrate
  labels:
    app.kubernetes.io/name: planner-migrate
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: planner-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # Use the same image tag as the Planner Deployment.
          image: gateway-planner:local
          imagePullPolicy: IfNotPresent
          args:
            - migrate
          env:
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: planner-credentials
                  key: app-key
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: planner-credentials
                  key: database-url
            - name: REGISTRY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: planner-credentials
                  key: registry-token
            - name: GATEWAY_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: spinner-planner
                  key: internal-token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
