apiVersion: apps/v1
kind: Deployment
metadata:
  name: spinner
spec:
  template:
    spec:
      containers:
        - name: spinner
          ports:
            - name: delivery-admin
              containerPort: 5052
              protocol: TCP
          env:
            - name: GATEWAY_DELIVERY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gateway-shared-delivery
                  key: database-url
            - name: GATEWAY_DELIVERY_ADMIN_ADDR
              value: ":5052"
