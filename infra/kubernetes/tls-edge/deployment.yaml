apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-tls-edge
  labels:
    app.kubernetes.io/name: gateway-tls-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-tls-edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-tls-edge
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: caddy
          # Build infra/docker/Gateway.tls-edge.Dockerfile and replace this tag.
          image: gateway-tls-edge:local
          imagePullPolicy: IfNotPresent
          env:
            - name: GATEWAY_PUBLIC_HOST
              value: gateway.example.com
            - name: GATEWAY_TLS_UPSTREAM
              value: http://spinner:80
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
            - name: tls
              mountPath: /etc/gateway/tls
              readOnly: true
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 2
            failureThreshold: 20
          livenessProbe:
            tcpSocket:
              port: https
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 128Mi
      volumes:
        - name: caddyfile
          configMap:
            name: gateway-tls-edge
        - name: tls
          secret:
            secretName: gateway-tls
        - name: config
          emptyDir: {}
        - name: data
          emptyDir: {}
