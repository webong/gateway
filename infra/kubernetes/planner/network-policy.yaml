apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: planner-ingress
  labels:
    app.kubernetes.io/name: planner
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: planner
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: spinner
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: provision-worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: planner
      ports:
        - protocol: TCP
          port: 8080
