apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../spinner
  - service.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: spinner
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: spinner
      spec:
        template:
          spec:
            securityContext:
              fsGroup: 10001
            containers:
              - name: spinner
                ports:
                  - name: smtp
                    containerPort: 2525
                    protocol: TCP
                env:
                  - name: GATEWAY_SMTP_ADDR
                    value: ":2525"
                  - name: GATEWAY_SMTP_HOSTNAME
                    valueFrom:
                      configMapKeyRef:
                        name: gateway-smtp
                        key: hostname
                  - name: GATEWAY_SMTP_RECIPIENT_PREFLIGHT
                    value: "true"
                  - name: GATEWAY_SMTP_TLS_CERT_FILE
                    value: /etc/gateway-smtp/tls.crt
                  - name: GATEWAY_SMTP_TLS_KEY_FILE
                    value: /etc/gateway-smtp/tls.key
                volumeMounts:
                  - name: smtp-tls
                    mountPath: /etc/gateway-smtp
                    readOnly: true
            volumes:
              - name: smtp-tls
                secret:
                  secretName: gateway-smtp-tls
                  defaultMode: 0440
