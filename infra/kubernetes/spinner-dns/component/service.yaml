apiVersion: v1
kind: Service
metadata:
  name: spinner-dns
  labels:
    app.kubernetes.io/name: spinner-dns
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: spinner
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
