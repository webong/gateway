services:
  gateway:
    build:
      context: ../..
      dockerfile: infra/docker/Gateway.spinner.Dockerfile
    restart: unless-stopped
    environment:
      GATEWAY_RUNTIME: http
      PORT: "5001"
      GATEWAY_PLANNER_URL: "${GATEWAY_PLANNER_URL:?Set the Laravel planner URL}"
      GATEWAY_INTERNAL_TOKEN: "${GATEWAY_INTERNAL_TOKEN:?Set the shared internal token}"
    ports:
      - "5001:5001/tcp"
      - "53:5353/tcp"
      - "53:5353/udp"
    volumes:
      - gateway-extensions:/data/extensions

volumes:
  gateway-extensions:
